[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slotbook"
version = "1.0.0"
description = "Booking engine with expiring holds, concurrency-safe slots and a state machine"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konain Sultan Khan (KK)", email = "kkdev9715@gmail.com" }]
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
